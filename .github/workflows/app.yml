name: app

# Every pull request: check the step content files, run tests and build, then deploy a preview to Vercel.
# Every push to main (a merged PR): the same checks, then deploy to production.
# Deploys go through the Vercel CLI, not Vercel's Git integration, so a teammate's
# merge is never blocked by the Hobby plan's commit-author check.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Step content check
        run: npm run check:content
      - name: Content check tests
        run: npm run test:scripts
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks, so only deploy branches of this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@65.17.0
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN
      - name: Build for Vercel
        run: vercel build $PROD_FLAG --token=$VERCEL_TOKEN
      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
